name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android PATH and NDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          NDK_VERSION=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_VERSION" ]; then
            sdkmanager --install "ndk;26.1.10909125"
            NDK_VERSION="26.1.10909125"
          fi
          echo "Using NDK: $NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project and patch permissions
        run: |
          pnpm tauri android init
          node scripts/patch-android.js

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Organize and Sign APK Artifacts
        run: |
          mkdir -p output-apks
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using Android build tools from: $BUILD_TOOLS_DIR"
          
          keytool -genkeypair -v -keystore release.jks -alias museek -keyalg RSA -keysize 2048 -validity 10000 -storepass museek123 -keypass museek123 -dname "CN=Museek, OU=App, O=Museek, C=CN"

          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"unsigned"* ]]; then
              signed_name="${filename//-unsigned/}"
              echo "Signing $filename -> $signed_name..."
              $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:museek123 --key-pass pass:museek123 --ks-key-alias museek --out "output-apks/$signed_name" "$apk"
            else
              cp "$apk" output-apks/
            fi
          done

          echo "Final APKs in output-apks:"
          ls -lh output-apks/
          for apk in output-apks/*.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $apk..."
              $BUILD_TOOLS_DIR/apksigner verify -v "$apk" || true
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Museek-Android-APK
          path: output-apks/*.apk

      - name: Release APK (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
