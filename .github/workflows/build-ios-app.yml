name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Link Cargo to standard system path
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo ln -sf "$HOME/.cargo/bin/"* /usr/local/bin/ || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri iOS project and patch configurations
        run: |
          CI=true pnpm tauri ios init
          node scripts/patch-ios.js

      - name: Build frontend
        run: pnpm build

      - name: Build iOS Application
        run: |
          CI=true pnpm tauri ios build --export-method debugging -- -- CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

      - name: Package iOS IPA & App Bundles
        run: |
          set -e
          mkdir -p output-ios

          # Search for existing IPA or .app bundle
          IPA_FOUND=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -type f -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_FOUND" ]; then
            echo "Found existing IPA at: $IPA_FOUND"
            cp "$IPA_FOUND" output-ios/Museek-3.8.0.ipa
          else
            APP_PATH=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "*.app" 2>/dev/null | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: No .app bundle found!"
              echo "Listing contents of src-tauri/gen/apple:"
              find src-tauri/gen/apple -maxdepth 4 || true
              exit 1
            fi
            echo "Found app bundle at: $APP_PATH"

            # Ad-hoc codesign
            echo "Ad-hoc signing .app bundle..."
            codesign --force --deep --sign - "$APP_PATH" || true

            # Package into IPA
            echo "Packaging into IPA..."
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r -y output-ios/Museek-3.8.0.ipa Payload/
            rm -rf Payload

            # Companion zip
            APP_NAME=$(basename "$APP_PATH")
            APP_DIR=$(dirname "$APP_PATH")
            (cd "$APP_DIR" && zip -r -y "$GITHUB_WORKSPACE/output-ios/${APP_NAME}.zip" "$APP_NAME")
          fi

          echo "Final iOS artifacts:"
          ls -lh output-ios/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Museek-iOS-IPA
          path: output-ios/*

      - name: Release iOS IPA (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-ios/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
